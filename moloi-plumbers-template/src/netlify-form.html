<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Moloi Plumbers Contact Form</title>
  </head>

  <body>
    <!-- This file allows Netlify to register the AJAX contact form. -->
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
    >
      <input type="hidden" name="form-name" value="contact" />
      <input type="hidden" name="subject" />
      <input name="bot-field" />

      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />

      <select name="area">
        <option value=""></option>
      </select>

      <select name="service">
        <option value=""></option>
      </select>

      <textarea name="message"></textarea>

      <button type="submit">Send</button>
    </form>
  </body>
</html>
